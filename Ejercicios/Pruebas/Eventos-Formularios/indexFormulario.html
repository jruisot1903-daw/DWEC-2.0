<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos-Formularios</title>
    <link rel="stylesheet" href="./css/styleFormulario.css">
    <script src="./js/mainFormularios.js" defer></script>
</head>
<body>
    <h2 id="info"></h2>
    <hr>

    <form id="form1">
        <input type="text" name="" id="login" placeholder="Login">
        <br>
        <input type="password" name="" id="pass"  placeholder="Password">
        <br>
        <a href="#" id="aForm1">Enviar</a>
    </form>
   
    <form>
        <label for="">Categoria:</label>
        <br>
        <select name="" id="colores" multiple size="2">
            <option value="" disabled selected>Elige opción</option>
            <option value="DB4021">Rojo</option>
            <option value="2181DB">Azul</option>
            <option value="AC37D4">Violeta</option>
            <option value="D48337">Naranja</option>
            <option value="D4CF37">Amarillo</option>
            <option value="37D444">Verde</option>
        </select>

        <label for="">Elige una opción:</label>
        <label>Tengo menos de 10 <input type="radio" name="edades" value="1"></label>
        <label>Tengo más de 10 y menos de 18<input type="radio" name="edades" value="2"></label>
        <label>Tengo entre 18 y 110 <input type="radio" name="edades" value="3" checked></label>
        <br>
        <textarea name="" id="textArea"></textarea>
    </form>
    <hr>
    <meter value="50" min="0" max="100" id="meter"></meter>
    <progress value="50" min="0" max="100" id="progress"></progress>
    <input type="range" id="rango">
</body>
</html>
