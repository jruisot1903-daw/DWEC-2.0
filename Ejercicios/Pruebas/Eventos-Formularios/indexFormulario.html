<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos-Formularios</title>
    <link rel="stylesheet" href="./css/styleFormulario.css">
    <script src="./js/mainFormularios.js" defer></script>
</head>
<body>
    <h2 id="info"></h2>
    <form action="#" id="form1">
        <!-- <label for="usu">Usuario:</label> -->
        <input type="text" name="usu" id="usu" placeholder="Login">

        <!-- <label for="pass">Password:</label> -->
        <input type="password" name="pass" id="pass" placeholder="Password">

         <a href="#" id="aForm1">Enviar</a>
    </form>

    <form action="#" id="form2">
        <label for="Categoria">Categoria:</label>
        <br>
        <select name="Categoria" id="">
            <option value="Deportes">Deportes</option>
            <option value="Comida">Comida</option>
            <option value="Tecnologia">Tecnologia</option>
        </select>

        <br>
        <label for="">Elije una opcion:</label>
        <br>
        <label for="">Tengo más de 18</label>
        <input type="radio" name="edad" value="1">
        <label for="">Tengo menos de 18</label>
        <input type="radio" name="edad" value="2">
    </form>
    
</body>
</html>
